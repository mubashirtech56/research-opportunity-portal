$kind: http-request
url: "{{baseUrl}}/api/opportunities"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "title": "Network Intrusion Detection",
      "description": "Research work on network intrusion detection",
      "research_area": "Cyber Security",
      "faculty_name": "Dr. Ahmed Khan",
      "department": "Computer Science",
      "required_skills": "Python, Networking",
      "positions": 2,
      "deadline": "2026-12-31",
      "status": "Open"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 201 Created", function () {
        pm.response.to.have.status(201);
      });

      pm.test("Response contains the created opportunity", function () {
        const body = pm.response.json();
        pm.expect(body).to.have.property("id");
        pm.expect(body.title).to.eql("Network Intrusion Detection");
        pm.expect(body.status).to.eql("Open");
      });
    language: text/javascript
order: 1000
