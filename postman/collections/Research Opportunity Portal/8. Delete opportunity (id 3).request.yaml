$kind: http-request
url: "{{baseUrl}}/api/opportunities/3"
method: DELETE
headers:
  Content-Type: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 OK", function () {
        pm.response.to.have.status(200);
      });

      pm.test("Response confirms the deletion", function () {
        const body = pm.response.json();
        pm.expect(body.message).to.eql("Opportunity deleted");
      });
    language: text/javascript
order: 8000
