$kind: http-request
url: "{{baseUrl}}/api/opportunities/2"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "status": "Closed"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 OK", function () {
        pm.response.to.have.status(200);
      });

      pm.test("Status changed from Open to Closed", function () {
        const body = pm.response.json();
        pm.expect(body.status).to.eql("Closed");
      });
    language: text/javascript
order: 7000
